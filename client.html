<!DOCTYPE html>
<html lang="ko">
<link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

<head>
    <meta charset="UTF-8">
    <title>블랙Go!</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #121314;
            color: #C9D1D9;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            text-align: center;
            line-height: 1.2;
            user-select: none;
            font-size: 14px;
            gap: 5px;
        }

        html {
            overflow: hidden;
            overflow-y: scroll;
            height: 100%;

        }

        div {
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            line-height: 1.2;
            position: relative;
            background-color: #121314;
            gap: 5px;
            white-space: nowrap;
            padding: 5px;
            border-radius: 10px;
        }

        input {
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            line-height: 1.2;
            border-radius: 10px;
            text-align: center;
            white-space: nowrap;
            padding: 5px;
            border-radius: 10px;
        }

        #알림 {
            transition: opacity 0.5s ease-in-out;

            opacity: 1;
        }

        .버튼:hover {
            background-color: #3b3d3f !important;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <meta name="viewport" content="width=device-width, initial-scale=0.9">

    <script type="module">
        import * as 정의 from "./공용정의.js";

        for (const 이름 in 정의) {
            window[이름] = 정의[이름];
        }

        for (const 이름 in 정의.스타일) {
            window[이름] = 정의.스타일[이름];
        }

        for (const 이름 in 정의.색상) {
            window[이름] = 정의.색상[이름];
        }

        document.addEventListener("dragstart", 이벤트 => 이벤트.preventDefault());
        document.addEventListener("selectstart", 이벤트 => 이벤트.preventDefault());
        document.addEventListener("contextmenu", 이벤트 => 이벤트.preventDefault());

        window.유저 = null;
        window.서브 = null;
        window.유저들 = null;
        window.접속토큰 = null;
        window.반자동전투 = false;

        //화면초기화함수
        function 화면초기화() {
            const 모든화면 = document.querySelectorAll('[id$="화면박스"]');
            모든화면.forEach(h => h.style.display = 'none');
            const 모든메뉴 = document.querySelectorAll('[id$="메뉴박스"]');
            모든메뉴.forEach(h => h.style.display = 'none');
            if (window.드랍박스) {
                드랍박스.remove();
                delete window.드랍박스;
            }
        }

        function 메뉴초기화() {
            const 모든메뉴 = document.querySelectorAll('[id$="메뉴박스"]');
            모든메뉴.forEach(h => h.style.display = 'none');
        }

        객체생성(document.body, `화면가리개`, 가림막,);


        //서버요청함수
        async function 서버요청(유형, 데이터) {

            if (화면가리개.style.display === 'block') {
                return;
            }

            화면가리개.style.display = 'block';
            document.body.style.cursor = 'wait';
            try {
                const 응답 = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 유형, 데이터 })
                });
                return await 응답.json();
            } catch (에러) {
                console.error("통신 에러:", 에러);
                return { 성공: false, 메세지: "서버 연결 실패" };
            } finally {
                화면가리개.style.display = 'none';
                document.body.style.cursor = 'default';
            }
        }

        객체생성(document.body, `팝업화면박스`, 화면중앙, 가로(380), 테두리, 제트(999));
        //팝업함수
        function 팝업(메세지) {
            if (window.event) {
                window.event.stopPropagation();
            }

            return new Promise((resolve) => {
                팝업화면박스.innerHTML = '';
                팝업화면박스.style.display = 'flex';

                객체생성(팝업화면박스, '팝업메세지', 왼쪽);
                팝업메세지.innerHTML = 메세지;

                객체생성(팝업화면박스, '버튼영역', 양쪽);

                객체생성(버튼영역, '취소버튼', 버튼, 테두리);
                취소버튼.innerHTML = '취소';
                취소버튼.onclick = () => {
                    팝업화면박스.style.display = 'none';
                    resolve(false); // false를 반환하고 끝냄
                };

                // 확인 버튼
                객체생성(버튼영역, '확인버튼', 버튼, 테두리);
                확인버튼.innerHTML = '확인';
                확인버튼.onclick = () => {
                    팝업화면박스.style.display = 'none';
                    resolve(true); // true를 반환하고 끝냄
                };
            });
        }

        객체생성(document.body, `미니정보창`, 화면중앙, 가로(380), 테두리, 제트(99), 숨기기);


        객체생성(document.body, `상단바`, 밑줄, 가로꽉, 최상단, 제트(9), 노여백);

        객체생성(상단바, `상단바박스`, 가로(400),);
        객체생성(상단바박스, `상단바박스1`, 양쪽);
        객체생성(상단바박스1, `상단바타이틀과아이디`, 버튼);
        상단바타이틀과아이디.innerHTML = `블랙Go!`;
        상단바타이틀과아이디.onclick = async (e) => {
            e.stopPropagation();

            유저정보화면함수();
        };

        객체생성(상단바박스1, `상단바메뉴묶음`, 가로정렬, 노여백);

        객체생성(상단바메뉴묶음, `모험버튼`, 버튼,);
        모험버튼.innerHTML = `모험`;
        모험버튼.onclick = async (e) => {
            e.stopPropagation();

            모험화면함수();
        };

        객체생성(상단바메뉴묶음, `던전버튼`, 버튼,);
        던전버튼.innerHTML = `던전`;
        던전버튼.onclick = async (e) => {
            e.stopPropagation();

            던전화면함수();
        };


        객체생성(상단바메뉴묶음, `성장버튼`, 버튼,);
        성장버튼.innerHTML = `성장`;

        객체생성(성장버튼, `성장메뉴박스`, 메뉴, 가로(100), 숨기기, 테두리,);

        성장버튼.onclick = (e) => {
            e.stopPropagation();
            메뉴초기화();
            const isHidden = 성장메뉴박스.style.display === 'none';
            성장메뉴박스.style.display = isHidden ? 'flex' : 'none';
        };

        객체생성(성장메뉴박스, `상점버튼`, 버튼);
        상점버튼.innerHTML = `상점`;
        상점버튼.onclick = async (e) => {
            e.stopPropagation();

            상점화면함수();
        };

        객체생성(성장메뉴박스, `장비버튼`, 버튼);
        장비버튼.innerHTML = `장비`;
        장비버튼.onclick = async (e) => {
            e.stopPropagation();

            장비화면함수();
        };

        객체생성(성장메뉴박스, `특성버튼`, 버튼);
        특성버튼.innerHTML = `특성`;
        특성버튼.onclick = async (e) => {
            e.stopPropagation();

            특성화면함수();
        };


        // 객체생성(성장메뉴박스, `인벤토리버튼`, 버튼);
        // 인벤토리버튼.innerHTML = `인벤토리`;
        // 인벤토리버튼.onclick = async (e) => {
        //     e.stopPropagation();

        //     인벤토리화면함수();
        // };


        객체생성(상단바메뉴묶음, `전당버튼`, 버튼,);
        전당버튼.innerHTML = `전당`;
        전당버튼.onclick = async (e) => {
            e.stopPropagation();

            전당화면함수();
        };




        객체생성(상단바메뉴묶음, `설정버튼`, 버튼,);
        설정버튼.innerHTML = `설정`;

        객체생성(설정버튼, `설정메뉴박스`, 메뉴, 가로(100), 숨기기, 테두리,);

        설정버튼.onclick = (e) => {
            e.stopPropagation();
            메뉴초기화();
            const isHidden = 설정메뉴박스.style.display === 'none';
            설정메뉴박스.style.display = isHidden ? 'flex' : 'none';
        };

        객체생성(설정메뉴박스, `회원탈퇴버튼`, 버튼, 진빨);
        회원탈퇴버튼.innerHTML = `회원탈퇴`;
        회원탈퇴버튼.onclick = async (e) => {
            e.stopPropagation();

            const 확인 = await 팝업(`정말로 탈퇴하시겠습니까?<br>데이터가 모두 사라집니다.`);
            if (!확인) return;
            const 탈퇴결과 = await 서버요청('회원탈퇴', { 토큰: 접속토큰 });
            if (탈퇴결과.성공) {

                location.reload();
            }

        };

        객체생성(설정메뉴박스, `로그아웃버튼`, 버튼);
        로그아웃버튼.innerHTML = `로그아웃`;
        로그아웃버튼.onclick = async (e) => {
            e.stopPropagation();

            const 확인 = await 팝업(`정말 로그아웃 하시겠습니까?`);
            if (!확인) return;

            location.reload();

        };

        객체생성(설정메뉴박스, `빈칸버튼`, 밑줄, 가로꽉,);
        // 빈칸버튼.innerHTML = `　`;


        객체생성(설정메뉴박스, `패치노트버튼`, 버튼,);
        패치노트버튼.innerHTML = `패치노트`;
        패치노트버튼.onclick = async (e) => {
            e.stopPropagation();

            패치노트화면함수();
        };

        객체생성(설정메뉴박스, `커뮤니티버튼`, 버튼,);
        커뮤니티버튼.innerHTML = `커뮤니티`;
        커뮤니티버튼.onclick = async (e) => {
            e.stopPropagation();

            커뮤니티화면함수();
        };

        객체생성(설정메뉴박스, `우편함버튼`, 버튼,);
        우편함버튼.innerHTML = `우편함`;
        우편함버튼.onclick = async (e) => {
            e.stopPropagation();

            우편함화면함수();
        };




        상단바메뉴묶음.style.display = `none`;



        객체생성(document.body, `상단빈공간`, 세로(상단바.offsetHeight),);
        상단빈공간.innerHTML = `　`;


        객체생성(document.body, `알림박스`, 진노);
        알림박스.innerHTML = `　`;

        //알림표시함수
        function 알림표시(메시지) {
            알림박스.style.transition = 'none';

            알림박스.innerHTML = 메시지;
            알림박스.style.opacity = 1;

            if (window.알림타이머) {
                clearTimeout(window.알림타이머);
            }

            setTimeout(() => {
                알림박스.style.transition = 'opacity 0.5s';
            }, 10);

            window.알림타이머 = setTimeout(() => {
                알림박스.style.opacity = 0;

                setTimeout(() => {
                    if (알림박스.style.opacity == 0) {
                        알림박스.innerHTML = '　';
                    }
                }, 500);
            }, 2500);
        }

        //메인화면바로가기
        function 메인화면함수() {
            화면초기화();

            알림표시(`　`);

            if (!window.메인화면박스) {
                객체생성(document.body, '메인화면박스', 가로(400), 테두리);
            }

            메인화면박스.innerHTML = '';
            메인화면박스.style.display = 'flex';

            객체생성(메인화면박스, '메인화면설명', 중앙, 밑줄,);
            메인화면설명.innerHTML = `
            저 멀리 악마들이 살고있는 성이 보입니다

            `;

            객체생성(메인화면박스, `메인박스`, 가로꽉);

            인풋생성(메인박스, `메인아이디`, { placeholder: '아이디를 입력하세요' });
            메인아이디.oninput = () => {
                if (메인아이디.value.length >= 7) {
                    알림표시(`아이디는 7자까지만 가능합니다`);
                    메인아이디.value = 메인아이디.value.slice(0, 7);
                }
            };

            인풋생성(메인박스, '메인비번', { type: 'password', placeholder: '비밀번호를 입력하세요' });
            메인비번.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    메인로그인.click();
                }
            };

            객체생성(메인박스, `메인회원가입`, 버튼, 테두리);
            메인회원가입.innerHTML = `회원가입`;

            메인회원가입.onclick = async (e) => {
                e.stopPropagation();

                try {
                    const 결과 = await 서버요청('회원가입', {
                        아이디: 메인아이디.value,
                        비번: 메인비번.value
                    });

                    if (결과.성공) {
                        알림표시(결과.메세지);
                    } else {
                        알림표시(결과.메세지);
                    }
                } catch (에러) {

                } finally {

                }

            };


            객체생성(메인박스, `메인로그인`, 버튼, 테두리);
            메인로그인.innerHTML = `로그인`;

            메인로그인.onclick = async (e) => {
                e.stopPropagation();

                try {
                    const 결과 = await 서버요청('로그인', {
                        아이디: 메인아이디.value,
                        비번: 메인비번.value
                    });

                    if (결과.성공) {
                        유저 = 결과.데이터;
                        유저들 = 결과.유저들;
                        서브 = 결과.서브데이터;
                        접속토큰 = 결과.토큰;

                        상단바타이틀과아이디.innerHTML = 유저.아이디;

                        // 패치노트화면함수();
                        모험화면함수();
                        알림표시(결과.메세지);

                        상단바메뉴묶음.style.display = `flex`;

                        if (유저.주인장) {
                            객체생성(설정메뉴박스, `주인장버튼`, 버튼, 글자마력(노랑));
                            주인장버튼.innerHTML = `주인장`;
                            주인장버튼.onclick = async (e) => {
                                e.stopPropagation();

                                주인장화면함수();
                            };
                        }
                    } else {
                        알림표시(결과.메세지);
                    }
                } catch (에러) {

                } finally {

                }

            };


        }

        메인화면함수();


        객체생성(document.body, '드랍박스', 화면중앙, 테두리, 테두리마력(글자), 글자마력(글자), 가로(380), 큰여백);
        드랍박스.innerHTML = `블랙Go!에 오신걸 환영합니다`;



        //주인장화면바로가기
        function 주인장화면함수() {
            화면초기화();

            알림표시(`　`);


            try {
                if (!window.주인장화면박스) {
                    객체생성(document.body, '주인장화면박스', 가로(400), 테두리);
                }

                주인장화면박스.innerHTML = ``;
                주인장화면박스.style.display = `flex`;

                객체생성(주인장화면박스, `주인장화면설명`, 밑줄, 가로꽉);

                주인장화면설명.innerHTML = `
                너가 주인장이더냐<br>

                `;


                객체생성(주인장화면박스, `주인장화면모든계정삭제`, 버튼, 테두리);
                주인장화면모든계정삭제.innerHTML = `모든계정삭제`;
                주인장화면모든계정삭제.onclick = async (e) => {
                    e.stopPropagation();


                    const 확인 = await 팝업(`모든 데이터를 삭제하시겠습니까?`);
