            }

            if (화면가리개.style.display === 'block') {

                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 유형, 데이터 })

                return await 응답.json();
            } catch (에러) {

                return { 성공: false, 메세지: "서버 연결 실패" };
            } finally {
                화면가리개.style.display = 'none';
                document.body.style.cursor = 'default';
            }

                취소버튼.onclick = () => {

                    resolve(false); // false를 반환하고 끝냄

                // 확인 버튼
                객체생성(버튼영역, '확인버튼', 버튼, 테두리);
                확인버튼.innerHTML = '확인';
                확인버튼.onclick = () => {
                    팝업화면박스.style.display = 'none';
                    resolve(true); // true를 반환하고 끝냄
                };
            });
        }

        let mouseX = 0;

        let clickInterval = null;
        let isKeyDown = false;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('keydown', (e) => {
            if ((e.key === 'm' || e.key === 'ㅡ') && !isKeyDown) {
                isKeyDown = true;

                if (clickInterval) clearInterval(clickInterval);

                clickInterval = setInterval(() => {
                    const element = document.elementFromPoint(mouseX, mouseY);
                    if (element && typeof element.click === 'function') {
                        try {
                            element.click();
                        } catch (err) {

                        }
                    }
                }, 100);
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'm' || e.key === 'ㅡ') {
                isKeyDown = false;
                if (clickInterval) {
                    clearInterval(clickInterval);
                    clickInterval = null;
                }
            }
        });

        window.addEventListener('blur', () => {
            isKeyDown = false;
            if (clickInterval) {
                clearInterval(clickInterval);
                clickInterval = null;
            }
        });
